<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>機器人監控面板</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #261020; }
        ::-webkit-scrollbar-thumb { background: #5c254d; border-radius: 3px; }
    </style>
</head>
<body class="bg-[#170913] text-pink-100 min-h-screen font-sans">

    <header class="bg-[#261020] border-b border-[#3d1933] shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-5 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="h-3 w-3 rounded-full bg-pink-500 animate-pulse shadow-[0_0_8px_#ec4899]"></div>
                <h1 class="text-xl font-bold text-white tracking-wide drop-shadow-[0_0_6px_#ec4899]">機器人監控面板</h1>
            </div>
            <a href="/admin" class="bg-pink-600 hover:bg-pink-700 text-white text-sm font-medium px-5 py-2 rounded-lg transition shadow-[0_0_10px_rgba(236,72,153,0.3)] focus:outline-none">
                進入管理後台
            </a>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8 space-y-8">
        
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-6">
            <div class="bg-[#230d1c] p-6 rounded-xl border border-[#3d1933] shadow-lg text-center flex flex-col justify-center min-h-[120px]">
                <p class="text-xs font-medium text-pink-400/70 mb-2 uppercase tracking-wider">機器人連線狀態</p>
                <p id="bot-status-text" class="text-lg font-bold text-pink-700">檢測中...</p>
            </div>
            <div class="bg-[#230d1c] p-6 rounded-xl border border-[#3d1933] shadow-lg text-center flex flex-col justify-center min-h-[120px]">
                <p class="text-xs font-medium text-pink-400/70 mb-2 uppercase tracking-wider">當前帳號名稱</p>
                <p id="bot-name-text" class="text-lg font-bold text-pink-200 truncate">讀取中...</p>
            </div>
            <div class="bg-[#230d1c] p-6 rounded-xl border border-[#3d1933] shadow-lg text-center flex flex-col justify-center min-h-[120px]">
                <p class="text-xs font-medium text-pink-400/70 mb-2 uppercase tracking-wider">已進駐伺服器總數</p>
                <p id="bot-guilds-text" class="text-xl font-bold text-pink-400">0 個</p>
            </div>
            <div class="bg-[#230d1c] p-6 rounded-xl border border-[#3d1933] shadow-lg text-center flex flex-col justify-center min-h-[120px]">
                <p class="text-xs font-medium text-pink-400/70 mb-2 uppercase tracking-wider">中央處理器 (CPU)</p>
                <p id="bot-cpu-text" class="text-xl font-bold text-rose-400">0 %</p>
            </div>
            <div class="bg-[#230d1c] p-6 rounded-xl border border-[#3d1933] shadow-lg text-center flex flex-col justify-center min-h-[120px]">
                <p class="text-xs font-medium text-pink-400/70 mb-2 uppercase tracking-wider">記憶體 (RAM)</p>
                <p id="bot-ram-text" class="text-xl font-bold text-fuchsia-400">0 MB</p>
            </div>
        </div>

        <div class="bg-[#230d1c] p-6 rounded-xl border border-[#3d1933] shadow-lg">
            <h3 class="text-md font-semibold text-pink-300 tracking-wider mb-4 border-b border-[#3d1933] pb-2">伺服器詳細狀態</h3>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-[#3d1933] text-pink-400/60 text-xs tracking-wider uppercase">
                            <th class="px-4 py-3">伺服器名稱</th>
                            <th class="px-4 py-3">當前總人數</th>
                            <th class="px-4 py-3">機器人語音頻道狀態</th>
                        </tr>
                    </thead>
                    <tbody id="guilds-list-container" class="divide-y divide-[#321328] text-sm">
                        <tr>
                            <td colspan="3" class="px-4 py-6 text-center text-pink-500/70">正在同步伺服器資料中...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="bg-[#230d1c] p-6 rounded-xl border border-[#3d1933] shadow-lg flex flex-col">
            <div class="flex justify-between items-center mb-4 border-b border-[#3d1933] pb-2">
                <h3 class="text-md font-semibold text-pink-300 tracking-wider">系統即時日誌</h3>
                <span class="text-xs bg-[#321328] text-pink-400 px-2 py-0.5 rounded animate-pulse">每秒同步中</span>
            </div>
            <div id="log-container" class="bg-[#0f040c] p-4 rounded-lg font-mono text-xs text-pink-400 overflow-y-auto h-[450px] leading-relaxed whitespace-pre-wrap border border-[#321328]">
                {{ log_content }}
            </div>
        </div>
    </main>

    <script>
        // 即時同步機器人狀態與數據指標資料
        function updateSystemStatus() {
            fetch('/status')
                .then(res => res.json())
                .then(data => {
                    // 更新 5 大卡片指標
                    const statusEl = document.getElementById('bot-status-text');
                    if (data.bot_online) {
                        statusEl.textContent = "在線 (Online)";
                        statusEl.className = "text-lg font-bold text-emerald-400 drop-shadow-[0_0_4px_rgba(52,211,153,0.4)]";
                    } else {
                        statusEl.textContent = "離線 (Offline)";
                        statusEl.className = "text-lg font-bold text-rose-500";
                    }
                    document.getElementById('bot-name-text').textContent = data.bot_name;
                    document.getElementById('bot-guilds-text').textContent = data.guilds_count + " 個";
                    document.getElementById('bot-cpu-text').textContent = data.cpu + " %";
                    document.getElementById('bot-ram-text').textContent = data.ram + " MB";

                    // 動態渲染伺服器名單、當前人數與語音頻道狀態
                    const guildsContainer = document.getElementById('guilds-list-container');
                    if (data.guilds && data.guilds.length > 0) {
                        let html = '';
                        data.guilds.forEach(g => {
                            // 當在線時，自動追加秒級跳動的時間長度
                            const durationBadge = g.voice_duration ? `<span class="block text-xs text-pink-400/80 mt-1">⏱️ 已連接：${g.voice_duration}</span>` : '';
                            const voiceStatus = g.in_voice 
                                ? `<div class="py-1"><span class="text-pink-400 font-semibold">🟢 竊聽中 (${g.voice_channel})</span>${durationBadge}</div>` 
                                : '<span class="text-pink-800/60">睡覺中</span>';
                                
                            html += `
                                <tr class="hover:bg-pink-950/20 transition">
                                    <td class="px-4 py-3.5 text-pink-100 font-medium">${g.name}</td>
                                    <td class="px-4 py-3.5 text-rose-400 font-medium">${g.member_count} 人</td>
                                    <td class="px-4 py-3.5">${voiceStatus}</td>
                                </tr>
                            `;
                        });
                        guildsContainer.innerHTML = html;
                    } else {
                        guildsContainer.innerHTML = `
                            <tr>
                                <td colspan="3" class="px-4 py-6 text-center text-pink-800/50">目前機器人未進駐任何伺服器。</td>
                            </tr>
                        `;
                    }
                })
                .catch(() => console.log("連線監控狀態同步失敗"));
        }

        // 定時同步台北時間日誌
        function updateLogs() {
            fetch('/api/logs')
                .then(res => res.json())
                .then(data => {
                    const container = document.getElementById('log-container');
                    const isAtBottom = container.scrollHeight - container.clientHeight <= container.scrollTop + 30;
                    container.textContent = data.logs.join('\n');
                    if (isAtBottom) {
                        container.scrollTop = container.scrollHeight;
                    }
                })
                .catch(() => console.log("日誌載入中斷"));
        }

        // 頁面初始化與定時循環排程
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('log-container');
            if (container) {
                container.scrollTop = container.scrollHeight;
            }
            
            // 變更為 1000 毫秒（1秒動一次！）
            updateSystemStatus();
            setInterval(updateSystemStatus, 1000);
            setInterval(updateLogs, 1000);
        });
    </script>
</body>
</html>
