<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>機器人監控面板</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
    </style>
</head>
<body class="bg-[#0f172a] text-slate-200 min-h-screen font-sans">

    <header class="bg-[#1e293b] border-b border-slate-700 shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-5 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="h-3 w-3 rounded-full bg-emerald-500 animate-pulse"></div>
                <h1 class="text-xl font-bold text-white tracking-wide">機器人監控面板</h1>
            </div>
            <a href="/admin" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium px-5 py-2 rounded-lg transition shadow-md focus:outline-none">
                進入管理後台
            </a>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8 space-y-8">
        
        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <div class="bg-[#1e293b] p-6 rounded-xl border border-slate-700 shadow-lg text-center flex flex-col justify-center min-h-[120px]">
                <p class="text-xs font-medium text-slate-400 mb-2 uppercase tracking-wider">機器人連線狀態</p>
                <p id="bot-status-text" class="text-lg font-bold text-slate-500">檢測中...</p>
            </div>
            <div class="bg-[#1e293b] p-6 rounded-xl border border-slate-700 shadow-lg text-center flex flex-col justify-center min-h-[120px]">
                <p class="text-xs font-medium text-slate-400 mb-2 uppercase tracking-wider">當前帳號名稱</p>
                <p id="bot-name-text" class="text-lg font-bold text-white truncate">讀取中...</p>
            </div>
            <div class="bg-[#1e293b] p-6 rounded-xl border border-slate-700 shadow-lg text-center flex flex-col justify-center min-h-[120px]">
                <p class="text-xs font-medium text-slate-400 mb-2 uppercase tracking-wider">已加入的伺服器總數</p>
                <p id="bot-guilds-text" class="text-xl font-bold text-blue-400">0 個</p>
            </div>
            <div class="bg-[#1e293b] p-6 rounded-xl border border-slate-700 shadow-lg text-center flex flex-col justify-center min-h-[120px]">
                <p class="text-xs font-medium text-slate-400 mb-2 uppercase tracking-wider">中央處理器 (CPU)</p>
                <p id="bot-cpu-text" class="text-xl font-bold text-cyan-400">0 %</p>
            </div>
            <div class="bg-[#1e293b] p-6 rounded-xl border border-slate-700 shadow-lg text-center flex flex-col justify-center min-h-[120px]">
                <p class="text-xs font-medium text-slate-400 mb-2 uppercase tracking-wider">記憶體 (RAM)</p>
                <p id="bot-ram-text" class="text-xl font-bold text-purple-400">0 %</p> 
            </div>
            <div class="bg-[#1e293b] p-6 rounded-xl border border-slate-700 shadow-lg text-center flex flex-col justify-center min-h-[120px]">
                <p class="text-xs font-medium text-slate-400 mb-2 uppercase tracking-wider">Discord 延遲</p>
                <p id="bot-dc-ping-text" class="text-xl font-bold text-yellow-400">0 ms</p>
            </div>
            <div class="bg-[#1e293b] p-6 rounded-xl border border-slate-700 shadow-lg text-center flex flex-col justify-center min-h-[120px]">
                <p class="text-xs font-medium text-slate-400 mb-2 uppercase tracking-wider">Google 延遲</p>
                <p id="bot-google-ping-text" class="text-xl font-bold text-orange-400">0 ms</p>
            </div>
        </div>

        <div class="bg-[#1e293b] p-6 rounded-xl border border-slate-700 shadow-lg">
            <h3 class="text-md font-semibold text-slate-300 tracking-wider mb-4 border-b border-slate-700 pb-2">伺服器詳細狀態</h3>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-slate-700 text-slate-400 text-xs tracking-wider uppercase">
                            <th class="px-4 py-3">伺服器名稱</th>
                            <th class="px-4 py-3">當前總人數</th>
                            <th class="px-4 py-3">機器人語音頻道狀態</th>
                        </tr>
                    </thead>
                    <tbody id="guilds-list-container" class="divide-y divide-slate-800 text-sm">
                        <tr>
                            <td colspan="3" class="px-4 py-6 text-center text-slate-500">正在同步伺服器資料中...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="bg-[#1e293b] p-6 rounded-xl border border-slate-700 shadow-lg flex flex-col">
            <div class="flex justify-between items-center mb-4 border-b border-slate-700 pb-2">
                <h3 class="text-md font-semibold text-slate-300 tracking-wider">系統即時日誌</h3>
                <span class="text-xs bg-slate-800 text-slate-400 px-2 py-0.5 rounded">自動更新</span>
            </div>
            <div id="log-container" class="bg-[#0f172a] p-4 rounded-lg font-mono text-xs text-emerald-400 overflow-y-auto h-[450px] leading-relaxed whitespace-pre-wrap border border-slate-800">
                {{ log_content }}
            </div>
        </div>
    </main>

    <script>
        function updateSystemStatus() {
            fetch('/status')
                .then(res => res.json())
                .then(data => {
                    const statusEl = document.getElementById('bot-status-text');
                    if (data.bot_online) {
                        statusEl.textContent = "在線 (Online)";
                        statusEl.className = "text-lg font-bold text-emerald-400";
                    } else {
                        statusEl.textContent = "離線 (Offline)";
                        statusEl.className = "text-lg font-bold text-red-400";
                    }
                    document.getElementById('bot-name-text').textContent = data.bot_name;
                    document.getElementById('bot-guilds-text').textContent = data.guilds_count + " 個";
                    document.getElementById('bot-cpu-text').textContent = data.cpu + " %";
                    document.getElementById('bot-ram-text').textContent = data.ram + " %";
                    document.getElementById('bot-dc-ping-text').textContent = (data.discord_ping >= 0 ? data.discord_ping : "--") + " ms";
                    document.getElementById('bot-google-ping-text').textContent = (data.google_ping >= 0 ? data.google_ping : "--") + " ms";

                    const guildsContainer = document.getElementById('guilds-list-container');
                    if (data.guilds && data.guilds.length > 0) {
                        let html = '';
                        data.guilds.forEach(g => {
                            // 在此處將語音持續時間（g.voice_duration）串接在狀態後面
                            const voiceStatus = g.in_voice 
                                ? `<span class="text-emerald-400 font-semibold">竊聽中 (${g.voice_channel})</span> <span class="text-slate-400 ml-2 text-xs bg-slate-800 px-1.5 py-0.5 rounded border border-slate-700">已連接: ${g.voice_duration}</span>` 
                                : '<span class="text-slate-500">睡覺中</span>';
                            html += `
                                <tr class="hover:bg-slate-800/40 transition">
                                    <td class="px-4 py-3.5 text-white font-medium">${g.name}</td>
                                    <td class="px-4 py-3.5 text-blue-400 font-medium">${g.member_count} 人</td>
                                    <td class="px-4 py-3.5 flex items-center h-full">${voiceStatus}</td>
                                </tr>
                            `;
                        });
                        guildsContainer.innerHTML = html;
                    } else {
                        guildsContainer.innerHTML = `
                            <tr>
                                <td colspan="3" class="px-4 py-6 text-center text-slate-500">目前機器人未在任何伺服器。</td>
                            </tr>
                        `;
                    }
                })
                .catch(() => console.log("連線監控狀態同步失敗"));
        }

        function updateLogs() {
            fetch('/api/logs')
                .then(res => res.json())
                .then(data => {
                    const container = document.getElementById('log-container');
                    const isAtBottom = container.scrollHeight - container.clientHeight <= container.scrollTop + 30;
                    container.textContent = data.logs.join('\n');
                    if (isAtBottom) {
                        container.scrollTop = container.scrollHeight;
                    }
                })
                .catch(() => console.log("日誌載入中斷"));
        }

         document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('log-container');
            if (container) {
                container.scrollTop = container.scrollHeight;
            }
            
            // 執行同步與建立定時器（改為 1 秒刷新一次）
            updateSystemStatus();
            setInterval(updateSystemStatus, 1000);
            setInterval(updateLogs, 1000);
        });
    </script>
</body>
</html>
