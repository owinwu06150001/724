<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>機器人監控面板</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 淺粉色風格捲動軸 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #fff1f2; }
        ::-webkit-scrollbar-thumb { background: #f43f5e; border-radius: 3px; }
    </style>
</head>
<body class="bg-[#fff5f6] text-slate-700 min-h-screen font-sans">

    <header class="bg-white border-b border-pink-100 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-5 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="h-3 w-3 rounded-full bg-pink-500 animate-pulse shadow-[0_0_8px_#ec4899]"></div>
                <h1 class="text-xl font-bold text-pink-600 tracking-wide">機器人監控面板</h1>
            </div>
            <a href="/admin" class="bg-pink-500 hover:bg-pink-600 text-white text-sm font-medium px-5 py-2 rounded-lg transition shadow-sm focus:outline-none">
                進入管理後台
            </a>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8 space-y-8">
        
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-7 gap-4">
            <div class="bg-white p-4 rounded-xl border border-pink-100 shadow-sm text-center flex flex-col justify-center min-h-[110px]">
                <p class="text-[11px] font-bold text-pink-400 mb-1 uppercase tracking-wider">連線狀態</p>
                <p id="bot-status-text" class="text-base font-bold text-slate-400">檢測中...</p>
            </div>
            <div class="bg-white p-4 rounded-xl border border-pink-100 shadow-sm text-center flex flex-col justify-center min-h-[110px]">
                <p class="text-[11px] font-bold text-pink-400 mb-1 uppercase tracking-wider">帳號名稱</p>
                <p id="bot-name-text" class="text-base font-bold text-slate-700 truncate">讀取中...</p>
            </div>
            <div class="bg-white p-4 rounded-xl border border-pink-100 shadow-sm text-center flex flex-col justify-center min-h-[110px]">
                <p class="text-[11px] font-bold text-pink-400 mb-1 uppercase tracking-wider">進駐伺服器</p>
                <p id="bot-guilds-text" class="text-lg font-bold text-pink-500">0 個</p>
            </div>
            <div class="bg-white p-4 rounded-xl border border-pink-100 shadow-sm text-center flex flex-col justify-center min-h-[110px]">
                <p class="text-[11px] font-bold text-pink-400 mb-1 uppercase tracking-wider">CPU 使用率</p>
                <p id="bot-cpu-text" class="text-lg font-bold text-rose-400">0 %</p>
            </div>
            <div class="bg-white p-4 rounded-xl border border-pink-100 shadow-sm text-center flex flex-col justify-center min-h-[110px]">
                <p class="text-[11px] font-bold text-pink-400 mb-1 uppercase tracking-wider">RAM 記憶體</p>
                <p id="bot-ram-text" class="text-lg font-bold text-fuchsia-400">0 MB</p>
            </div>
            <div class="bg-white p-4 rounded-xl border border-pink-100 shadow-sm text-center flex flex-col justify-center min-h-[110px]">
                <p class="text-[11px] font-bold text-pink-400 mb-1 uppercase tracking-wider">Discord 延遲</p>
                <p id="bot-discord-ping-text" class="text-lg font-bold text-amber-500">0 ms</p>
            </div>
            <div class="bg-white p-4 rounded-xl border border-pink-100 shadow-sm text-center flex flex-col justify-center min-h-[110px]">
                <p class="text-[11px] font-bold text-pink-400 mb-1 uppercase tracking-wider">網路延遲</p>
                <p id="bot-google-ping-text" class="text-lg font-bold text-teal-500">0 ms</p>
            </div>
        </div>

        <div class="bg-white p-6 rounded-xl border border-pink-100 shadow-sm">
            <h3 class="text-sm font-bold text-pink-600 tracking-wider mb-4 border-b border-pink-500/10 pb-2">伺服器詳細狀態</h3>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-pink-100 text-pink-400 text-xs tracking-wider uppercase">
                            <th class="px-4 py-3">伺服器名稱</th>
                            <th class="px-4 py-3">當前總人數</th>
                            <th class="px-4 py-3">機器人語音頻道狀態</th>
                        </tr>
                    </thead>
                    <tbody id="guilds-list-container" class="divide-y divide-pink-50/50 text-sm">
                        <tr>
                            <td colspan="3" class="px-4 py-6 text-center text-pink-300">正在同步伺服器資料中...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="bg-white p-6 rounded-xl border border-pink-100 shadow-sm flex flex-col">
            <div class="flex justify-between items-center mb-4 border-b border-pink-500/10 pb-2">
                <h3 class="text-sm font-bold text-pink-600 tracking-wider">系統即時日誌</h3>
                <span class="text-[10px] bg-pink-50 text-pink-500 font-medium px-2 py-0.5 rounded animate-pulse">每秒即時更新</span>
            </div>
            <div id="log-container" class="bg-[#faf4f5] p-4 rounded-lg font-mono text-xs text-pink-700 overflow-y-auto h-[450px] leading-relaxed whitespace-pre-wrap border border-pink-50">
                {{ log_content }}
            </div>
        </div>
    </main>

    <script>
        // 即時同步機器人狀態與數據指標資料
        function updateSystemStatus() {
            fetch('/status')
                .then(res => res.json())
                .then(data => {
                    // 1. 更新連線狀態卡片
                    const statusEl = document.getElementById('bot-status-text');
                    if (data.bot_online) {
                        statusEl.textContent = "在線 (Online)";
                        statusEl.className = "text-base font-bold text-emerald-500";
                    } else {
                        statusEl.textContent = "離線 (Offline)";
                        statusEl.className = "text-base font-bold text-rose-500";
                    }
                    
                    // 2. 更新基礎資訊
                    document.getElementById('bot-name-text').textContent = data.bot_name;
                    document.getElementById('bot-guilds-text').textContent = data.guilds_count + " 個";
                    document.getElementById('bot-cpu-text').textContent = data.cpu + " %";
                    document.getElementById('bot-ram-text').textContent = data.ram + " MB";

                    // 3. 更新加回來的雙 PING 資料
                    document.getElementById('bot-discord-ping-text').textContent = (data.discord_ping >= 0 ? data.discord_ping : 0) + " ms";
                    document.getElementById('bot-google-ping-text').textContent = (data.google_ping >= 0 ? data.google_ping : 0) + " ms";

                    // 4. 動態渲染伺服器名單與語音計時器
                    const guildsContainer = document.getElementById('guilds-list-container');
                    if (data.guilds && data.guilds.length > 0) {
                        let html = '';
                        data.guilds.forEach(g => {
                            // 當語音在線時，顯示每秒動態跳時的計時器
                            const durationBadge = g.voice_duration ? `<span class="block text-xs text-pink-500/80 mt-1 font-mono">⏱️ 已連接：${g.voice_duration}</span>` : '';
                            const voiceStatus = g.in_voice 
                                ? `<div class="py-1"><span class="text-pink-600 font-semibold">🟢 監聽中 (${g.voice_channel})</span>${durationBadge}</div>` 
                                : '<span class="text-slate-400">睡覺中</span>';
                                
                            html += `
                                <tr class="hover:bg-pink-50/30 transition">
                                    <td class="px-4 py-3.5 text-slate-700 font-medium">${g.name}</td>
                                    <td class="px-4 py-3.5 text-pink-600 font-medium">${g.member_count} 人</td>
                                    <td class="px-4 py-3.5">${voiceStatus}</td>
                                </tr>
                            `;
                        });
                        guildsContainer.innerHTML = html;
                    } else {
                        guildsContainer.innerHTML = `
                            <tr>
                                <td colspan="3" class="px-4 py-6 text-center text-pink-300">目前機器人未進駐任何伺服器。</td>
                            </tr>
                        `;
                    }
                })
                .catch(() => console.log("連線監控狀態同步失敗"));
        }

        // 定時同步台北時間日誌
        function updateLogs() {
            fetch('/api/logs')
                .then(res => res.json())
                .then(data => {
                    const container = document.getElementById('log-container');
                    const isAtBottom = container.scrollHeight - container.clientHeight <= container.scrollTop + 30;
                    container.textContent = data.logs.join('\n');
                    if (isAtBottom) {
                        container.scrollTop = container.scrollHeight;
                    }
                })
                .catch(() => console.log("日誌載入中斷"));
        }

        // 頁面初始化與定時循環排程 (1秒動一次)
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('log-container');
            if (container) {
                container.scrollTop = container.scrollHeight;
            }
            
            // 完美設定為 1000 毫秒（1秒）刷新間隔
            updateSystemStatus();
            setInterval(updateSystemStatus, 1000);
            setInterval(updateLogs, 1000);
        });
    </script>
</body>
</html>
