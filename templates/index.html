<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>機器人核心控制台 - 狀態監控</title>
    <style>
        body {
            background-color: #121824;
            color: #e2e8f0;
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #1e293b;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        h1 { margin: 0; color: #38bdf8; font-size: 24px; }
        .btn {
            background-color: #2563eb;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn:hover { background-color: #1d4ed8; }
        .status-card {
            background-color: #1e293b;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
        }
        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }
        .status-item {
            background-color: #0f172a;
            padding: 15px;
            border-radius: 6px;
            text-align: center;
        }
        .status-label { font-size: 14px; color: #94a3b8; margin-bottom: 5px; }
        .status-value { font-size: 18px; font-weight: bold; color: #f1f5f9; }
        .terminal {
            background-color: #050b14;
            border: 1px solid #1e293b;
            border-radius: 6px;
            padding: 15px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            color: #4ade80;
            line-height: 1.6;
            height: 350px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>機器人狀態即時監控面板</h1>
            <a href="/admin" class="btn">進入管理後台</a>
        </div>

        <div class="status-card">
            <div class="status-grid">
                <div class="status-item">
                    <div class="status-label">機器人連線狀態</div>
                    <div class="status-value" id="bot-status">連線檢索中...</div>
                </div>
                <div class="status-item">
                    <div class="status-label">當前帳號名稱</div>
                    <div class="status-value" id="bot-name">載入中...</div>
                </div>
                <div class="status-item">
                    <div class="status-label">已進駐伺服器總數</div>
                    <div class="status-value" id="bot-guilds">0 個</div>
                </div>
            </div>
        </div>

        <h3>系統即時操作日誌</h3>
        <div class="terminal" id="logs-container">{{ log_content|safe }}</div>
    </div>

    <script>
        // 定時向後端拉取最新狀態資訊
        function updateStatus() {
            fetch('/status')
                .then(res => res.json())
                .then(data => {
                    const statusEl = document.getElementById('bot-status');
                    if (data.bot_online) {
                        statusEl.textContent = '在線 (Online)';
                        statusEl.style.color = '#4ade80';
                    } else {
                        statusEl.textContent = '離線 (Offline)';
                        statusEl.style.color = '#ef4444';
                    }
                    document.getElementById('bot-name').textContent = data.bot_name;
                    document.getElementById('bot-guilds').textContent = data.guilds_count + ' 個';
                })
                .catch(err => console.error('無法取得狀態快取', err));
        }

        // 頁面載入後自動滾動日誌到最底端
        const logBox = document.getElementById('logs-container');
        logBox.scrollTop = logBox.scrollHeight;

        // 每 5 秒自動重新整理狀態欄位
        setInterval(updateStatus, 5000);
        updateStatus();
    </script>
</body>
</html>
