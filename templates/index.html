<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>機器人管理後台</title>
    {% raw %}
    <style>
        body { background: #0f172a; color: #f8fafc; padding: 30px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; }
        .container { max-width: 1100px; margin: 0 auto; }
        h1 { font-size: 28px; font-weight: 700; margin-bottom: 25px; color: #f1f5f9; border-left: 5px solid #5865F2; padding-left: 15px; }
        h3 { font-size: 18px; margin-top: 0; margin-bottom: 15px; color: #cbd5e1; font-weight: 600; }
        .main-card { background: #1e293b; padding: 24px; border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3); border: 1px solid #334155; margin-bottom: 25px; }
        .stats-bar { display: flex; gap: 20px; background: #0f172a; padding: 12px 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #1e293b; font-size: 14px; color: #94a3b8; }
        .stats-bar span { color: #38bdf8; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 15px; }
        th { background: #0f172a; color: #94a3b8; text-align: left; padding: 12px; font-weight: 600; }
        /* 確保終端機區塊擁有自動換行與滾動條 */
        .terminal { height: 180px; overflow-y: auto; background: #090d16; color: #34d399; margin-top: 15px; padding: 15px; font-family: "Fira Code", Menlo, Monaco, Consolas, monospace; font-size: 13px; border-radius: 8px; border: 1px solid #1e293b; line-height: 1.6; white-space: pre-wrap; word-break: break-all; }
        .grid-layout { display: grid; grid-template-columns: 1fr 1.5fr; gap: 25px; }
        .sub-card { background: #1e293b; padding: 20px; border-radius: 12px; border: 1px solid #334155; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2); }
        input, select, textarea { width: 100%; background: #0f172a; border: 1px solid #475569; color: #f8fafc; padding: 10px 14px; border-radius: 6px; margin-bottom: 12px; font-size: 14px; box-sizing: border-box; transition: all 0.2s; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #5865F2; box-shadow: 0 0 0 3px rgba(88, 101, 242, 0.2); }
        textarea { resize: vertical; height: 90px; }
        button { background: #5865F2; color: white; border: none; padding: 10px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background 0.2s; font-size: 14px; }
        button:hover { background: #4752c4; }
        .btn-danger { background: #f43f5e; }
        .btn-danger:hover { background: #e11d48; }
        .flex-buttons { display: flex; gap: 10px; }
    </style>
    {% endraw %}
</head>
<body>
    <div class="container">
        <h1>機器人管理後台</h1>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2 style="color: #f8fafc; font-size: 20px;">機器人運行狀態監控</h2>
            <a href="/admin" style="
                display: inline-block;
                background-color: #38bdf8;
                color: #0f172a;
                text-decoration: none;
                padding: 10px 20px;
                border-radius: 6px;
                font-weight: 600;
                font-size: 14px;
                transition: background-color 0.3s;
            " onmouseover="this.style.backgroundColor='#0ea5e9'" onmouseout="this.style.backgroundColor='#38bdf8'">
                進入管理後台
            </a>
        </div>
        
        <div class="main-card">
            <h3>系統監控</h3>
            <div class="stats-bar">
                 <div>CPU 使用率: <span id="s-cpu">{{ bot_status['cpu'] }}%</span></div>
                 <div>RAM 使用率: <span id="s-ram">{{ bot_status['ram'] }}%</span></div>
                 <div>網路延遲: <span id="s-lat">{{ bot_status['latency'] }}ms</span></div>
            </div>
            
            <table>
                <thead>
                    <tr>
                        <th style="border-top-left-radius: 6px; border-bottom-left-radius: 6px;">伺服器名稱</th>
                        <th>成員數量</th>
                        <th style="border-top-right-radius: 6px; border-bottom-right-radius: 6px;">連線狀態</th>
                    </tr>
                </thead>
                <tbody>
                    {{ guild_rows|safe }}
                </tbody>
            </table>
            
            <div class="terminal" id="logs-container">{{ log_content|safe }}</div>
        </div>
    </div>

    <script>
        // 強制將日誌滾動條拉到最底部的函式
        function scrollToBottom() {
            const logsContainer = document.getElementById('logs-container');
            if (logsContainer) {
                logsContainer.scrollTop = logsContainer.scrollHeight;
            }
        }

        // 當網頁載入完成時，立刻執行一次置底
        window.addEventListener('DOMContentLoaded', () => {
            scrollToBottom();
            // 每 3 秒自動向後端刷新一次數據（若您有設定即時更新 API）
            setInterval(refreshSystemData, 3000);
        });

        // 定時向後端獲取最新狀態與日誌的 AJAX 邏輯
        function refreshSystemData() {
            // ⚠️ 請對照您後端實際提供監控數據的 API 路由名稱（例如 /get_stats）
            fetch('/get_stats_api') 
                .then(response => {
                    if (!response.ok) throw new Error();
                    return response.json();
                })
                .then(data => {
                    // 1. 動態更新 CPU、RAM 與延遲
                    document.getElementById('s-cpu').textContent = data.cpu + '%';
                    document.getElementById('s-ram').textContent = data.ram + '%';
                    document.getElementById('s-lat').textContent = data.latency + 'ms';
                    
                    // 2. 動態更新日誌區塊（若後端傳回的是 List 陣列，則用換行結合）
                    const logsContainer = document.getElementById('logs-container');
                    logsContainer.innerHTML = data.logs.join('\n');
                    
                    // 3. 關鍵：日誌填入完成後，立刻將捲軸再次吸附到最底部
                    scrollToBottom();
                })
                .catch(err => {
                    // 靜態網頁環境下若無此 API 可忽略錯誤
                    console.log('即時數據刷新暫時無法連線');
                });
        }
    </script>
</body>
</html>
