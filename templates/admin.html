<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>機器人核心控制台 - 遠端管理後台</title>
    <style>
        body {
            background-color: #121824;
            color: #e2e8f0;
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #1e293b;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        h1 { margin: 0; color: #38bdf8; font-size: 24px; }
        .btn-back {
            background-color: #475569;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
        }
        .control-card {
            background-color: #1e293b;
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
            border-left: 5px solid #38bdf8;
        }
        .control-card h2 {
            font-size: 18px;
            margin-top: 0;
            margin-bottom: 20px;
            color: #f1f5f9;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 8px;
        }
        select, textarea {
            width: 100%;
            padding: 12px;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #f1f5f9;
            font-size: 15px;
            box-sizing: border-box;
        }
        select:focus, textarea:focus {
            outline: none;
            border-color: #38bdf8;
        }
        .action-btn {
            width: 100%;
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .action-btn:hover {
            background-color: #0ea5e9;
        }
        .terminal-container {
            margin-top: 20px;
        }
        .terminal {
            background-color: #050b14;
            border: 1px solid #1e293b;
            border-radius: 6px;
            padding: 15px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            color: #4ade80;
            height: 150px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>遠端核心控制管理後台</h1>
            <a href="/" class="btn-back">返回首頁面板</a>
        </div>

        <div class="control-card">
            <h2>遠端文字廣播</h2>
            <div class="form-group">
                <label>選擇目標伺服器</label>
                <select id="text-guild-select" onchange="onTextGuildChange(this.value)">
                    <option value="">-- 請選擇目標伺服器 --</option>
                    {% for g in guilds %}
                        <option value="{{ g.id }}">{{ g.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>選擇發送文字頻道</label>
                <select id="text-channel-select">
                    <option value="">請先選擇伺服器</option>
                </select>
            </div>
            <div class="form-group">
                <label>廣播訊息內容</label>
                <textarea id="broadcast-message" rows="3" placeholder="請輸入欲推播的文字訊息..."></textarea>
            </div>
            <button class="action-btn" onclick="submitTextBroadcast()">發送訊息廣播任務</button>
        </div>

        <div class="control-card" style="border-left-color: #a855f7;">
            <h2>遠端語音連線控制</h2>
            <div class="form-group">
                <label>選擇目標伺服器</label>
                <select id="voice-guild-select" onchange="onVoiceGuildChange(this.value)">
                    <option value="">-- 請選擇目標伺服器 --</option>
                    {% for g in guilds %}
                        <option value="{{ g.id }}">{{ g.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>選擇加入語音頻道</label>
                <select id="voice-channel-select">
                    <option value="">請先選擇伺服器</option>
                </select>
            </div>
            <button class="action-btn" style="background-color: #a855f7; color: white;" onclick="submitVoiceJoin()">調動機器人加入該語音頻道</button>
        </div>

        <div class="terminal-container">
            <h3>系統執行回報狀態</h3>
            <div class="terminal" id="admin-logs">{{ log_content|safe }}</div>
        </div>
    </div>

    <script>
        // 自動拉回日誌到底部的輔助函式
        const logWindow = document.getElementById('admin-logs');
        logWindow.scrollTop = logWindow.scrollHeight;

        function refreshConsoleLogs() {
            // 自動引導使用者重新整理網頁或查看下方回報狀態
            logWindow.scrollTop = logWindow.scrollHeight;
        }

        // 1. 遠端文字廣播下拉選單觸發邏輯
        function onTextGuildChange(guildId) {
            const channelSelect = document.getElementById('text-channel-select'); 
            if (!guildId) {
                channelSelect.innerHTML = '<option value="">請先選擇伺服器</option>';
                return;
            }
            channelSelect.innerHTML = '<option value="">正在動態獲取頻道中...</option>';

            fetch(`/get_channels/${guildId}`)
                .then(response => {
                    if (!response.ok) throw new Error('HTTP 傳輸代碼出錯: ' + response.status);
                    return response.json();
                })
                .then(channels => {
                    channelSelect.innerHTML = '';
                    const list = Array.isArray(channels) ? channels : [];
                    
                    if (list.length === 0) {
                        channelSelect.innerHTML = '<option value="">此伺服器沒有可用的文字頻道</option>';
                        return;
                    }

                    list.forEach(ch => {
                        const option = document.createElement('option');
                        option.value = String(ch.id); // 強制字串儲存
                        option.textContent = ch.name;
                        channelSelect.appendChild(option);
                    });
                })
                .catch(error => {
                    console.error('文字頻道加載失敗:', error);
                    channelSelect.innerHTML = '<option value="">底層資料傳輸失敗，請重新切換伺服器嘗試</option>';
                });
        }

        // 2. 遠端語音連線下拉選單觸發邏輯
        function onVoiceGuildChange(guildId) {
            const voiceSelect = document.getElementById('voice-channel-select'); 
            if (!guildId) {
                voiceSelect.innerHTML = '<option value="">請先選擇伺服器</option>';
                return;
            }
            voiceSelect.innerHTML = '<option value="">正在動態獲取頻道中...</option>';

            fetch(`/get_voice_channels/${guildId}`)
                .then(response => {
                    if (!response.ok) throw new Error('HTTP 傳輸代碼出錯: ' + response.status);
                    return response.json();
                })
                .then(channels => {
                    voiceSelect.innerHTML = '';
                    const list = Array.isArray(channels) ? channels : [];
                    
                    if (list.length === 0) {
                        voiceSelect.innerHTML = '<option value="">此伺服器沒有可用的語音頻道</option>';
                        return;
                    }

                    list.forEach(ch => {
                        const option = document.createElement('option');
                        option.value = String(ch.id); // 強制字串儲存
                        option.textContent = ch.name;
                        voiceSelect.appendChild(option);
                    });
                })
                .catch(error => {
                    console.error('語音頻道加載失敗:', error);
                    voiceSelect.innerHTML = '<option value="">底層資料傳輸失敗，請重新切換伺服器嘗試</option>';
                });
        }

        // 3. 發送文字廣播任務表單提交
        function submitTextBroadcast() {
            const guildId = document.getElementById('text-guild-select').value;
            const channelId = document.getElementById('text-channel-select').value;
            const message = document.getElementById('broadcast-message').value;

            if (!guildId || !channelId || !message.trim()) {
                alert('請完整選取伺服器、頻道並填寫訊息內容！');
                return;
            }

            fetch('/send_broadcast', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ guild_id: guildId, channel_id: channelId, message: message })
            })
            .then(res => res.json())
            .then(data => {
                alert(data.message);
                if(data.success) {
                    document.getElementById('broadcast-message').value = '';
                    location.reload(); // 刷新網頁以同步底部日誌
                }
            })
            .catch(err => alert('發送失敗，請檢查網路連線狀態'));
        }

        // 4. 調動機器人加入語音頻道表單提交
        function submitVoiceJoin() {
            const guildId = document.getElementById('voice-guild-select').value;
            const channelId = document.getElementById('voice-channel-select').value;

            if (!guildId || !channelId) {
                alert('請完整選取伺服器與目標語音頻道！');
                return;
            }

            fetch('/join_voice', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ guild_id: guildId, channel_id: channelId })
            })
            .then(res => res.json())
            .then(data => {
                alert(data.message);
                location.reload(); // 刷新網頁以同步底部日誌
            })
            .catch(err => alert('語音指令傳送失敗，請確認後端運行狀態'));
        }
    </script>
</body>
</html>
