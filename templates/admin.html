<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Bot 高級管理控制台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
    </style>
</head>
<body class="bg-[#0f172a] text-slate-200 min-h-screen font-sans">

    <header class="bg-[#1e293b] border-b border-slate-700 sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="h-3 w-3 rounded-full bg-emerald-500 animate-pulse"></div>
                <h1 class="text-xl font-bold text-white tracking-wide">Discord Bot 管理後台</h1>
            </div>
            <div class="flex items-center gap-4">
                <span class="text-sm bg-slate-800 px-3 py-1.5 rounded-md border border-slate-700 text-slate-400">
                    管理員模式
                </span>
                <a href="/logout" class="bg-red-600/90 hover:bg-red-700 text-white text-sm font-medium px-4 py-2 rounded-lg transition-colors shadow-md shadow-red-900/20 focus:outline-none">
                    登出控制台
                </a>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <section class="lg:col-span-5 flex flex-col gap-4">
            <div class="bg-[#1e293b] p-6 rounded-xl border border-slate-700 shadow-xl flex-1 flex flex-col min-h-[400px]">
                <div class="flex justify-between items-center mb-4 border-b border-slate-700 pb-2">
                    <h3 class="text-md font-semibold text-slate-300 tracking-wider">系統日誌事件</h3>
                    <span class="text-xs bg-slate-800 text-slate-400 px-2 py-0.5 rounded">動態即時更新</span>
                </div>
                <div id="log-container" class="bg-[#0f172a] p-4 rounded-lg font-mono text-xs text-emerald-400 overflow-y-auto flex-1 h-[350px] leading-relaxed whitespace-pre-wrap border border-slate-800">
                    {{ log_content }}
                </div>
            </div>
        </section>

        <section class="lg:col-span-7 flex flex-col gap-8">
            
            <div class="bg-[#1e293b] p-6 rounded-xl border border-slate-700 shadow-xl space-y-4">
                <div class="border-l-4 border-blue-500 pl-3">
                    <h2 class="text-lg font-bold text-white tracking-wide">遠端文字廣播</h2>
                </div>
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1.5">選擇目標伺服器</label>
                        <select id="broadcast-guild" onchange="loadChannels('text')" class="w-full bg-[#0f172a] border border-slate-600 rounded-lg p-2.5 text-sm text-slate-200 focus:outline-none focus:border-blue-500 transition">
                            <option value="">-- 請選擇伺服器 --</option>
                            {% for g in guilds %}
                            <option value="{{ g.id }}">{{ g.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1.5">選擇發送文字頻道</label>
                        <select id="broadcast-channel" class="w-full bg-[#0f172a] border border-slate-600 rounded-lg p-2.5 text-sm text-slate-200 focus:outline-none focus:border-blue-500 transition">
                            <option value="">-- 請先選擇伺服器 --</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1.5">廣播訊息內容</label>
                    <textarea id="broadcast-msg" rows="3" placeholder="請輸入欲推播的文字訊息..." class="w-full bg-[#0f172a] border border-slate-600 rounded-lg p-3 text-sm text-slate-200 focus:outline-none focus:border-blue-500 transition placeholder-slate-500 resize-none"></textarea>
                </div>

                <button onclick="submitBroadcast()" class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg transition-colors text-sm shadow-md shadow-blue-900/20">
                    發送訊息廣播任務
                </button>
            </div>

            <div class="bg-[#1e293b] p-6 rounded-xl border border-slate-700 shadow-xl space-y-4">
                <div class="border-l-4 border-cyan-500 pl-3">
                    <h2 class="text-lg font-bold text-white tracking-wide">遠端語音連線控制</h2>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1.5">選擇目標伺服器</label>
                        <select id="voice-guild" onchange="loadChannels('voice')" class="w-full bg-[#0f172a] border border-slate-600 rounded-lg p-2.5 text-sm text-slate-200 focus:outline-none focus:border-cyan-500 transition">
                            <option value="">-- 請選擇伺服器 --</option>
                            {% for g in guilds %}
                            <option value="{{ g.id }}">{{ g.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1.5">選擇加入語音頻道</label>
                        <select id="voice-channel" class="w-full bg-[#0f172a] border border-slate-600 rounded-lg p-2.5 text-sm text-slate-200 focus:outline-none focus:border-cyan-500 transition">
                            <option value="">-- 請先選擇伺服器 --</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-2">
                    <button onclick="submitVoiceAction('join')" class="py-2.5 bg-cyan-600 hover:bg-cyan-700 text-white font-medium rounded-lg transition-colors text-sm shadow-md shadow-cyan-900/20">
                        調動機器人加入該語音頻道
                    </button>
                    <button onclick="submitVoiceAction('leave')" class="py-2.5 bg-slate-700 hover:bg-slate-600 text-slate-200 font-medium rounded-lg transition-colors text-sm border border-slate-600">
                        強制切斷語音連線 (離開)
                    </button>
                </div>
            </div>

        </section>
    </main>

    <script>
        // 動態頻道載入功能
        function loadChannels(type) {
            const guildSelect = document.getElementById(`${type}-guild`);
            const channelSelect = document.getElementById(`${type}-channel`);
            const guildId = guildSelect.value;

            // 如果使用者選回預設提示，則直接清空頻道列表，不向後端發送請求
            if (!guildId) {
                channelSelect.innerHTML = '<option value="">-- 請先選擇伺服器 --</option>';
                return;
            }

            channelSelect.innerHTML = '<option value="">讀取頻道資料中...</option>';
            const apiUrl = type === 'text' ? `/get_channels/${guildId}` : `/get_voice_channels/${guildId}`;

            fetch(apiUrl)
                .then(res => {
                    if (!res.ok) throw new Error("HTTP 狀態異常");
                    return res.json();
                })
                .then(data => {
                    channelSelect.innerHTML = '';
                    if (data.length === 0) {
                        channelSelect.innerHTML = '<option value="">該伺服器無可用頻道</option>';
                        return;
                    }
                    data.forEach(ch => {
                        const opt = document.createElement('option');
                        opt.value = ch.id;
                        opt.textContent = ch.name;
                        channelSelect.appendChild(opt);
                    });
                })
                .catch(err => {
                    console.error(err);
                    channelSelect.innerHTML = '<option value="">連線錯誤，請重新切換伺服器</option>';
                });
        }

        // 廣播非同步送出
        function submitBroadcast() {
            const guildId = document.getElementById('broadcast-guild').value;
            const channelId = document.getElementById('broadcast-channel').value;
            const message = document.getElementById('broadcast-msg').value;

            if (!guildId || !channelId || !message.trim()) {
                alert("請填妥伺服器、文字頻道以及訊息內容後再進行發送。");
                return;
            }

            fetch('/send_broadcast', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ guild_id: guildId, channel_id: channelId, message: message })
            })
            .then(res => res.json())
            .then(data => {
                alert(data.message);
                if (data.success) {
                    document.getElementById('broadcast-msg').value = '';
                }
            })
            .catch(() => alert("系統發送異常，請稍後再試。"));
        }

        // 語音控制非同步送出
        function submitVoiceAction(action) {
            const guildId = document.getElementById('voice-guild').value;
            const channelId = document.getElementById('voice-channel').value;

            if (!guildId) {
                alert("請先選擇目標伺服器。");
                return;
            }

            if (action === 'join' && !channelId) {
                alert("請選擇欲加入的語音頻道。");
                return;
            }

            const url = action === 'join' ? '/join_voice' : '/leave_voice';
            const payload = action === 'join' 
                ? { guild_id: guildId, channel_id: channelId } 
                : { guild_id: guildId };

            fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => alert(data.message))
            .catch(() => alert("系統調度異常，請檢視後端日誌。"));
        }

        // 日誌排程輪詢（每 3 秒自動更新）
        setInterval(() => {
            fetch('/api/logs')
                .then(res => res.json())
                .then(data => {
                    const container = document.getElementById('log-container');
                    const isAtBottom = container.scrollHeight - container.clientHeight <= container.scrollTop + 20;
                    container.textContent = data.logs.join('\n');
                    if (isAtBottom) {
                        container.scrollTop = container.scrollHeight;
                    }
                })
                .catch(err => console.log("日誌同步失敗"));
        }, 3000);
    </script>
</body>
</html>
