<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>機器人管理控制台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
    </style>
</head>
<body class="bg-[#0f172a] text-slate-200 min-h-screen font-sans">

    <header class="bg-[#1e293b] border-b border-slate-700 shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold text-white tracking-wide">機器人管理控制台</h1>
            <div class="flex gap-4">
                <a href="/" class="text-slate-400 hover:text-white transition px-3 py-2 text-sm font-medium">返回監控面板</a>
                <a href="/logout" class="bg-red-600 hover:bg-red-700 text-white text-sm font-medium px-4 py-2 rounded-lg transition shadow-md">登出系統</a>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-2 gap-8">
        
        <div class="space-y-6">
            
            <div class="bg-[#1e293b] p-6 rounded-xl border border-slate-700 shadow-lg">
                <h2 class="text-lg font-semibold text-white mb-4 border-b border-slate-700 pb-2">伺服器訊息廣播</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-400 mb-1">選擇目標伺服器</label>
                        <select id="bc-guild" onchange="loadTextChannels()" class="w-full bg-[#0f172a] border border-slate-600 text-white rounded px-3 py-2 focus:outline-none focus:border-blue-500">
                            <option value="">請先選擇伺服器</option>
                            {% for guild in guilds %}
                            <option value="{{ guild.id }}">{{ guild.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-400 mb-1">選擇文字頻道</label>
                        <select id="bc-channel" class="w-full bg-[#0f172a] border border-slate-600 text-white rounded px-3 py-2 focus:outline-none focus:border-blue-500">
                            <option value="">-- 尚未載入頻道 --</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-400 mb-1">廣播內容</label>
                        <textarea id="bc-message" rows="3" class="w-full bg-[#0f172a] border border-slate-600 text-white rounded px-3 py-2 focus:outline-none focus:border-blue-500 placeholder-slate-500" placeholder="輸入要發送的訊息..."></textarea>
                    </div>
                    <button onclick="sendBroadcast()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded transition shadow-md">發送廣播訊息</button>
                </div>
            </div>

            <div class="bg-[#1e293b] p-6 rounded-xl border border-slate-700 shadow-lg">
                <h2 class="text-lg font-semibold text-white mb-4 border-b border-slate-700 pb-2">語音頻道遠端控制</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-400 mb-1">選擇目標伺服器</label>
                        <select id="vc-guild" onchange="loadVoiceChannels()" class="w-full bg-[#0f172a] border border-slate-600 text-white rounded px-3 py-2 focus:outline-none focus:border-blue-500">
                            <option value="">請先選擇伺服器</option>
                            {% for guild in guilds %}
                            <option value="{{ guild.id }}">{{ guild.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-400 mb-1">選擇語音頻道</label>
                        <select id="vc-channel" class="w-full bg-[#0f172a] border border-slate-600 text-white rounded px-3 py-2 focus:outline-none focus:border-blue-500">
                            <option value="">尚未載入語音頻道</option>
                        </select>
                    </div>
                    <div class="flex gap-4">
                        <button onclick="joinVoice()" class="w-1/2 bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2 rounded transition shadow-md">強制加入語音</button>
                        <button onclick="leaveVoice()" class="w-1/2 bg-slate-600 hover:bg-slate-700 text-white font-medium py-2 rounded transition shadow-md">強制退出語音</button>
                    </div>
                </div>
            </div>

        </div>

        <div class="bg-[#1e293b] p-6 rounded-xl border border-slate-700 shadow-lg flex flex-col h-full min-h-[500px]">
            <div class="flex justify-between items-center mb-4 border-b border-slate-700 pb-2">
                <h3 class="text-md font-semibold text-slate-300">操作日誌</h3>
                <span class="text-xs bg-slate-800 text-slate-400 px-2 py-0.5 rounded">即時更新</span>
            </div>
            <div id="log-container" class="bg-[#0f172a] p-4 rounded-lg font-mono text-xs text-emerald-400 overflow-y-auto flex-grow leading-relaxed whitespace-pre-wrap border border-slate-800">
                {{ log_content }}
            </div>
        </div>

    </main>

    <script>
        // 動態載入文字頻道
        async function loadTextChannels() {
            const guildId = document.getElementById('bc-guild').value;
            const channelSelect = document.getElementById('bc-channel');
            channelSelect.innerHTML = '<option value="">讀取中...</option>';
            if (!guildId) {
                channelSelect.innerHTML = '<option value="">請先選擇伺服器</option>';
                return;
            }
            try {
                const res = await fetch(`/get_channels/${guildId}`);
                const channels = await res.json();
                channelSelect.innerHTML = channels.length ? '' : '<option value="">此伺服器無文字頻道</option>';
                channels.forEach(ch => {
                    const opt = document.createElement('option');
                    opt.value = ch.id;
                    opt.textContent = ch.name;
                    channelSelect.appendChild(opt);
                });
            } catch {
                channelSelect.innerHTML = '<option value="">載入失敗</option>';
            }
        }

        // 動態載入語音頻道
        async function loadVoiceChannels() {
            const guildId = document.getElementById('vc-guild').value;
            const channelSelect = document.getElementById('vc-channel');
            channelSelect.innerHTML = '<option value="">讀取中...</option>';
            if (!guildId) {
                channelSelect.innerHTML = '<option value="">請先選擇伺服器</option>';
                return;
            }
            try {
                const res = await fetch(`/get_voice_channels/${guildId}`);
                const channels = await res.json();
                channelSelect.innerHTML = channels.length ? '' : '<option value="">此伺服器無語音頻道</option>';
                channels.forEach(ch => {
                    const opt = document.createElement('option');
                    opt.value = ch.id;
                    opt.textContent = ch.name;
                    channelSelect.appendChild(opt);
                });
            } catch {
                channelSelect.innerHTML = '<option value="">載入失敗</option>';
            }
        }

        // 發送廣播
        async function sendBroadcast() {
            const guildId = document.getElementById('bc-guild').value;
            const channelId = document.getElementById('bc-channel').value;
            const message = document.getElementById('bc-message').value;
            if (!guildId || !channelId || !message) {
                alert("請完整選擇伺服器 頻道  並輸入訊息內容。");
                return;
            }
            const res = await fetch('/send_broadcast', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ guild_id: guildId, channel_id: channelId, message: message })
            });
            const data = await res.json();
            if (!data.success) alert("廣播失敗: " + data.message);
            else document.getElementById('bc-message').value = ""; // 清空輸入框
            updateLogs();
        }

        // 加入語音
        async function joinVoice() {
            const guildId = document.getElementById('vc-guild').value;
            const channelId = document.getElementById('vc-channel').value;
            if (!guildId || !channelId) {
                alert("請選擇目標伺服器與語音頻道。");
                return;
            }
            const res = await fetch('/join_voice', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ guild_id: guildId, channel_id: channelId })
            });
            const data = await res.json();
            if (!data.success) alert("加入失敗: " + data.message);
            updateLogs();
        }

        // 退出語音
        async function leaveVoice() {
            const guildId = document.getElementById('vc-guild').value;
            if (!guildId) {
                alert("請選擇要退出的伺服器。");
                return;
            }
            const res = await fetch('/leave_voice', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ guild_id: guildId })
            });
            const data = await res.json();
            if (!data.success) alert("退出失敗: " + data.message);
            updateLogs();
        }

        // 定時更新日誌
        function updateLogs() {
            fetch('/api/logs')
                .then(res => res.json())
                .then(data => {
                    const container = document.getElementById('log-container');
                    const isAtBottom = container.scrollHeight - container.clientHeight <= container.scrollTop + 30;
                    container.textContent = data.logs.join('\n');
                    if (isAtBottom) {
                        container.scrollTop = container.scrollHeight;
                    }
                })
                .catch(() => console.log("日誌載入中斷"));
        }

        setInterval(updateLogs, 3000);
    </script>
</body>
</html>
